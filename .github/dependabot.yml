version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dev-security:
        patterns:
          - "mypy*"
          - "pytest*"
          - "ruff*"
          - "hypothesis*"
          - "bandit*"
          - "pip-audit*"
          - "zizmor*"
          - "gitleaks*"
      python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "mypy*"
          - "pytest*"
          - "ruff*"
          - "hypothesis*"
          - "bandit*"
          - "pip-audit*"
          - "zizmor*"
          - "gitleaks*"
