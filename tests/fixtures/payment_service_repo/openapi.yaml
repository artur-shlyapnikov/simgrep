openapi: 3.0.3
info:
  title: Payment REST API
  description: REST API for managing payments and rollbacks
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local development server
paths:
  /v1/payments:
    get:
      summary: List all payments
      operationId: listPayments
      tags:
        - Payment
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      summary: Create a new payment
      operationId: createPayment
      tags:
        - Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment created
  /v1/payments/{id}/rollback:
    post:
      summary: Rollback payment
      operationId: rollbackPayment
      tags:
        - Payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Rollback processed
components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
        status:
          type: string
    PaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number